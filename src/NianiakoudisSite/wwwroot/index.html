<!DOCTYPE html>
<html lang="el">
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600;700&family=Montserrat:wght@500;600;700&family=Noto+Sans:wght@300;400;500;700&display=swap">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TCS | Consulting Services</title>
    <base href="/" />
    <link rel="icon" type="image/jpeg" href="assets/logo/TCS-logo.jpg" />
    <link rel="shortcut icon" type="image/jpeg" href="assets/logo/TCS-logo.jpg" />
    <link rel="apple-touch-icon" href="assets/logo/TCS-logo.jpg" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div class="spinner-loader" role="status" aria-live="polite" aria-label="Φόρτωση">
            <span class="spinner-loader-ring" aria-hidden="true"></span>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/site.js"></script>
    <script>
        Blazor.start().then(function () {
            var loader = document.querySelector("#app .spinner-loader");
            if (!loader) return;
            loader.classList.add("is-hidden");
            window.setTimeout(function () {
                loader.remove();
            }, 260);
        });
    </script>
</body>
</html>
